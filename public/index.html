<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>USM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#e8f3ff;--ink:#10304f;--mut:#6a87a8;--b1:#2f8cff;--b2:#0b5bd3;--sky:#7cc8ff;--card:rgba(255,255,255,.82);--ok:#19b37a;--warn:#f0a020;--bad:#ef4f5f;--sh:0 8px 24px rgba(47,140,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 -apple-system,"SF Pro Text",Inter,Roboto,system-ui,sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(500px 300px at 90% -5%,#b9e0ff,transparent),radial-gradient(420px 300px at -10% 30%,#d3ecff,transparent),var(--bg);
padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{margin:14px 0;padding:20px;border-radius:26px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#4aa3ff,#0b5bd3);box-shadow:0 12px 30px rgba(11,91,211,.3)}
header:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.16)}
header h1{margin:0;font-size:24px;letter-spacing:-.4px}header p{margin:4px 0 0;opacity:.85;font-size:13px}
.badge{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.22);font-size:12px;font-weight:600;backdrop-filter:blur(6px)}
.card{background:var(--card);border:1px solid #fff;border-radius:20px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;backdrop-filter:blur(10px);animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}.row::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;border:0;padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.75);color:var(--b2);font:600 14px inherit;font-family:inherit;box-shadow:var(--sh);transition:.2s;text-align:center}
.chip.on{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;transform:translateY(-1px)}
.lbl{font-size:12px;font-weight:700;color:var(--mut);margin:6px 4px;text-transform:uppercase;letter-spacing:.6px}
.lesson{display:flex;gap:12px;padding:0}.lesson .n{width:64px;flex:none;padding:14px 0;text-align:center;background:linear-gradient(180deg,#e4f1ff,#d2e8ff);border-radius:20px 0 0 20px}
.n b{display:block;font-size:22px;color:var(--b2)}.n small{font-size:11px;color:var(--mut)}
.lesson .t{padding:12px 14px 12px 0;flex:1;min-width:0}.t h3{margin:0 0 4px;font-size:16px}
.t div{color:var(--mut);font-size:13px}.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;margin-bottom:6px;background:#dcecff;color:var(--b2)}
.tag.s{background:#d5f6f4;color:#0a8f8a}.tag.l{background:#e4e3ff;color:#4a46d6}
.lesson.now{outline:2px solid var(--b1);box-shadow:0 0 0 6px rgba(47,140,255,.16)}
.gap{border:2px dashed #b5d6f7;background:rgba(255,255,255,.4);color:var(--mut);text-align:center;box-shadow:none}
.empty{text-align:center;padding:36px 10px;color:var(--mut)}.empty b{display:block;font-size:42px}
.hero{text-align:center;color:#fff;background:linear-gradient(160deg,#5cb2ff,#1769e0);border:0}
.hero .e{font-size:64px}.hero .big{font-size:64px;font-weight:800;letter-spacing:-3px;line-height:1}.hero .d{opacity:.9;margin:6px 0 14px}
.hero .m{display:flex;justify-content:center;gap:10px;font-size:12px}.hero .m span{background:rgba(255,255,255,.2);padding:5px 11px;border-radius:99px}
.day{display:flex;align-items:center;gap:12px}.day .e{font-size:30px}.day .g{flex:1}.day .g small{display:block;color:var(--mut);font-size:12px}.day .tp{font-weight:700}.day .tp i{font-style:normal;color:var(--mut);font-weight:500}
input[type=text]{width:100%;padding:14px 16px;border-radius:14px;border:2px solid #cfe5ff;background:#fff;font:600 17px inherit;font-family:inherit;letter-spacing:2px;color:var(--ink);outline:0}
input:focus{border-color:var(--b1)}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;color:#fff;font:700 16px inherit;font-family:inherit;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 8px 20px rgba(11,91,211,.3)}
.btn:active{transform:scale(.98)}.hint{font-size:12px;color:var(--mut);margin-top:10px}
.bar{height:8px;border-radius:9px;background:#dcebfb;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;border-radius:9px;transition:width .8s}
.st{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.st b{color:var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.dots span{font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;background:#e5f1ff;color:var(--b2)}
.dots .a{background:#ffe3e6;color:var(--bad)}.dots .g{background:#d9f7ea;color:#0e8d5e}
.grade{float:right;min-width:42px;text-align:center;padding:6px 10px;border-radius:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--sky),var(--b1))}
.sk{height:84px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,#d8eaff 25%,#eef6ff 50%,#d8eaff 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 28px));display:flex;padding:6px;border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(11,91,211,.25);border:1px solid #fff}
nav button{flex:1;border:0;background:0;padding:8px 0;border-radius:18px;color:var(--mut);font:600 11px inherit;font-family:inherit;transition:.25s}
nav button span{display:block;font-size:21px}nav button.on{background:linear-gradient(135deg,#e1f0ff,#cbe5ff);color:var(--b2)}
.seg{display:flex;background:rgba(255,255,255,.6);padding:4px;border-radius:14px;margin-bottom:12px}.seg button{flex:1;border:0;background:0;padding:9px;border-radius:11px;font:600 13px inherit;font-family:inherit;color:var(--mut)}.seg .on{background:#fff;color:var(--b2);box-shadow:var(--sh)}

:root{--ln:#e1eefc;--ac:#0b5bd3}
.btn.alt{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
.dh{margin:18px 4px 8px;font-weight:800;font-size:17px}.dh.td{color:var(--b1)}
.prof{text-align:center}.prof h2{margin:10px 0 2px}.ava{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--sky),var(--b2));box-shadow:0 8px 22px rgba(11,91,211,.35);border:3px solid #fff}
html[data-th=dark]{--bg:#0a1424;--ink:#e7f1ff;--mut:#8ba5c6;--card:rgba(20,36,60,.82);--sh:0 8px 24px rgba(0,0,0,.4);--ac:#8ec5ff;--ln:#254468}
html[data-th=dark] body{background:radial-gradient(500px 300px at 90% -5%,#123a6e,transparent),radial-gradient(420px 300px at -10% 30%,#0e2748,transparent),var(--bg)}
html[data-th=dark] header{background:linear-gradient(135deg,#2b6fc7,#0a3a8a)}
html[data-th=dark] .hero{background:linear-gradient(160deg,#2b6fc7,#0e4aa8)}
html[data-th=dark] .card,html[data-th=dark] nav,html[data-th=dark] .ava{border-color:rgba(255,255,255,.08)}
html[data-th=dark] .chip:not(.on),html[data-th=dark] .seg{background:rgba(24,42,68,.88);color:var(--ac)}
html[data-th=dark] .seg button.on{background:#1d3a62;color:#fff}
html[data-th=dark] .lesson .n{background:linear-gradient(180deg,#16304f,#10253f)}
html[data-th=dark] .n b{color:var(--ac)}
html[data-th=dark] .tag{background:#173a66;color:var(--ac)}html[data-th=dark] .tag.s{background:#0f3a3c;color:#5fe0d9}html[data-th=dark] .tag.l{background:#26265e;color:#a9a6ff}
html[data-th=dark] .gap{border-color:#27466f;background:rgba(20,36,60,.4)}
html[data-th=dark] input[type=text]{background:#0f2036;border-color:#27466f;color:var(--ink)}
html[data-th=dark] nav{background:rgba(16,30,50,.92)}html[data-th=dark] nav button.on{background:#1d3a62;color:var(--ac)}
html[data-th=dark] .bar{background:#1b3555}html[data-th=dark] .dots span{background:#173a66;color:var(--ac)}html[data-th=dark] .dots .a{background:#4a1f2b;color:#ff8a96}html[data-th=dark] .dots .g{background:#12432f;color:#5fe0a8}
html[data-th=dark] .sk{background:linear-gradient(90deg,#15294a 25%,#1d3760 50%,#15294a 75%);background-size:200% 100%}

body{font-size:14px}.wrap{padding:0 12px}
header{margin:10px 0;padding:14px 16px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:19px}header p{font-size:12px;margin:2px 0 0;text-transform:capitalize}.badge{margin:0;position:relative;z-index:1;white-space:nowrap}

.set .lbl{margin:12px 2px 6px}.set .lbl:first-child{margin-top:0}.set .seg{margin:0;background:rgba(47,140,255,.1)}
html[data-th=dark] .set .seg{background:rgba(255,255,255,.06)}
.ob{padding:26px 18px;margin-top:8vh}.ob h2{margin:6px 0;font-size:24px}.ob .d{font-size:13px;margin-bottom:0}
.prof{padding:0;overflow:hidden}.ban{height:72px;background:linear-gradient(135deg,#6cc0ff,#1769e0)}
.prof .ava{margin:-44px auto 0;position:relative;width:84px;height:84px}.prof .in{padding:8px 14px 16px}
.pill{display:inline-block;margin:6px 3px 0;padding:4px 11px;border-radius:99px;background:rgba(47,140,255,.12);color:var(--ac);font-size:12px;font-weight:600}
.list{padding:2px 0}.li{display:flex;align-items:center;gap:12px;width:100%;border:0;background:0;padding:13px 16px;font:600 14px inherit;font-family:inherit;color:var(--ink);text-align:left}
.li+.li{border-top:1px solid var(--ln)}.li span{font-size:18px}.li i{margin-left:auto;font-style:normal;color:var(--mut)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:14px 8px 0}.foot a{color:var(--ac);font-weight:700;text-decoration:none}
.kv{font-size:13.5px;margin:2px 0}.kv small{color:var(--mut);font-size:12px;margin-right:4px}.tst{padding:8px 0;border-top:1px solid var(--ln);overflow:hidden}

.lesson .t{display:flex;align-items:center;gap:10px}.tx{flex:1;min-width:0}
.lesson .t .rm{flex:none;text-align:center;padding:6px 11px;border-radius:12px;background:linear-gradient(135deg,rgba(47,140,255,.2),rgba(47,140,255,.08));border:1px solid rgba(47,140,255,.3);color:var(--ac);font-weight:800;font-size:14px}
.rm small{display:block;font-size:9px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.dh.td{display:inline-block;padding:5px 14px;border-radius:14px;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;box-shadow:0 6px 16px rgba(11,91,211,.3)}
nav{background:rgba(255,255,255,.22);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 30px rgba(11,91,211,.18),inset 0 1px 1px rgba(255,255,255,.8);padding:6px}
nav button{position:relative;z-index:1}nav button.on{background:none;color:var(--b2)}
#ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.35));border:1px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(47,140,255,.3),inset 0 1px 2px #fff;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
html[data-th=dark] nav{background:rgba(30,50,80,.32);border-color:rgba(255,255,255,.14)}html[data-th=dark] nav button.on{background:none;color:#fff}
html[data-th=dark] #ind{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.08));border-color:rgba(255,255,255,.25);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.3)}
.sqs{display:flex;flex-wrap:wrap;gap:8px 7px;margin-top:10px}.sqw{display:flex;flex-direction:column;align-items:center;gap:2px;width:38px}.sqw small{font-size:9.5px;color:var(--mut)}
.sq{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--sky),var(--b1));box-shadow:0 3px 8px rgba(47,140,255,.2)}
.sq.p{background:#dcecff;font-size:15px;box-shadow:none}html[data-th=dark] .sq.p{background:#173a66}
.sq.a{background:linear-gradient(135deg,#ff8a95,#ef4f5f);font-size:14px}
.sq.g8{background:linear-gradient(135deg,#3fd69b,#19b37a)}.sq.g5{background:linear-gradient(135deg,#ffd45c,#f0a020);color:#4a3000}.sq.g1{background:linear-gradient(135deg,#ff8a95,#ef4f5f)}
.evh{display:flex;gap:8px;margin-bottom:8px}.evh div{flex:1;text-align:center;padding:10px 4px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#4aa3ff,#0b5bd3);box-shadow:var(--sh)}
.evh div:nth-child(2){background:linear-gradient(135deg,#6fd0ff,#2f8cff)}.evh div:nth-child(3){background:linear-gradient(135deg,#3fd0c9,#1a9fb8)}
.evh small{display:block;font-size:11px;opacity:.9}.evh b{font-size:22px}

.evt .ico{font-size:24px}.evt .g{flex:1;min-width:0}.sav{flex:none;padding:4px 10px;border-radius:99px;background:rgba(47,140,255,.15);color:var(--ac);font-weight:800;font-size:12px}

</style></head><body>
<div class="wrap"><header><h1>🏛 Расписание USM</h1><p id="date"></p><span class="badge" id="wk"></span></header><main id="v"></main></div>
<nav id="nav"><i id="ind"></i><button data-t="sch" class="on"><span>📅</span>Пары</button><button data-t="w"><span>🌤</span>Погода</button><button data-t="j"><span>📖</span>Журнал</button><button data-t="p"><span>👤</span>Профиль</button></nav>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#e8f3ff');tg.setBackgroundColor('#e8f3ff')}catch(e){}}
const $=s=>document.querySelector(s),v=$('#v');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,x)=>{try{localStorage.setItem(k,JSON.stringify(x))}catch{}}};
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница'],SH=['ПН','ВТ','СР','ЧТ','ПТ'];
const dow=(new Date().getDay()+6)%7;
function autoWeek(){let t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());if(dow>=5)t.setDate(t.getDate()+7-dow);const s=new Date(2026,8,21);if(t<s)t=s;return Math.floor(Math.round((t-s)/864e5)/7)%2?'even':'odd'}
const cfg=LS.g('cfg',null);
const S={t:'sch',th:cfg?.th||'auto',g:cfg?.g||'1',sg:cfg?.sg||'1',ob:!cfg,wk:autoWeek(),sub:'att',J:null,data:null};
const save=()=>LS.s('cfg',{th:S.th,g:S.g,sg:S.sg});
const TH=[['light','☀️ Светлая'],['dark','🌙 Тёмная'],['auto','📱 Авто']],GR=[['1','Группа 1'],['2','Группа 2'],['3','Группа 3']],SG=[['1','Подгруппа 1'],['2','Подгруппа 2']];
function applyTheme(){const d=S.th=='dark'||(S.th=='auto'&&(tg?tg.colorScheme=='dark':matchMedia('(prefers-color-scheme:dark)').matches));document.documentElement.dataset.th=d?'dark':'light';const c=d?'#0a1424':'#e8f3ff';try{tg?.setHeaderColor(c);tg?.setBackgroundColor(c)}catch(e){}}
applyTheme();
$('#date').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const wkTxt=()=>($('#wk').textContent='🗓 '+(S.wk=='even'?'Чётная':'Нечётная')+' неделя');wkTxt();
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.t=b.dataset.t;setTab(b);tg?.HapticFeedback?.selectionChanged();go()};
const go=()=>{$('#nav').style.display=S.ob?'none':'';document.querySelector('header').style.display=S.ob?'none':'';S.ob?onb():({sch:sched,w:weather,j:journal,p:profile})[S.t]()};
const chips=(arr,cur,cb,pre='')=>`<div class="row">${arr.map(([k,l])=>`<button class="chip ${k==cur?'on':''}" data-k="${k}" data-c="${cb}">${pre}${l}</button>`).join('')}</div>`;
v.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const k=b.dataset.k,c=b.dataset.c;tg?.HapticFeedback?.selectionChanged();
if(c=='g')S.g=k;if(c=='sg')S.sg=k;if(c=='th'){S.th=k;applyTheme()}if(c=='w'){S.wk=k;wkTxt()}if(c=='sub')S.sub=k;if(!S.ob&&'g sg th'.split(' ').includes(c))save();go()};
async function sched(){if(!S.data){v.innerHTML='<div class="sk"></div>'.repeat(4);try{S.data=await (await fetch('schedule.json')).json()}catch{v.innerHTML='<div class="card empty">Не удалось загрузить расписание</div>';return}}
const D=S.data,sd=D.schedule[S.g]?.[S.sg]||{},now=new Date(),mm=now.getHours()*60+now.getMinutes();
let h=`<div class="lbl">Группа ${S.g} · Подгруппа ${S.sg}</div><div class="seg">${[['odd','Нечётная'],['even','Чётная']].map(([k,l])=>`<button data-c="w" data-k="${k}" class="${S.wk==k?'on':''}">${l}</button>`).join('')}</div>`;
DAYS.forEach((dn,di)=>{const ds=sd[dn]||{},L={};for(const n in ds){const x=ds[n].all||ds[n][S.wk];if(x)L[n]=x}
const mx=Math.max(0,...Object.keys(L).map(Number));h+=`<div class="dh ${di==dow?'td':''}" id="d${di}">${dn}${di==dow?' · сегодня':''}</div>`;
if(!mx)h+='<div class="card gap">🎉 Пар нет</div>';
for(let n=1;n<=mx;n++){const tm=D.times[n]||'',l=L[n],[a,b]=tm.split('-').map(x=>{const[H,M]=x.split(':');return H*60+ +M});
if(!l){h+=`<div class="card gap">🪟 Окно · ${tm}</div>`;continue}
const cur=di==dow&&mm>=a&&mm<b,c=l.type[0]=='С'?'s':l.type[0]=='Л'&&l.type.length>6?'l':'';
h+=`<div class="card lesson ${cur?'now':''}" style="animation-delay:${n*40}ms"><div class="n"><b>${n}</b><small>${tm.replace('-','<br>')}</small></div><div class="t"><div class="tx"><span class="tag ${c}">${esc(l.type)}${cur?' · сейчас':''}</span><h3>${esc(l.subject)}</h3><div>👨‍🏫 ${esc(l.teacher)}</div></div><div class="rm"><small>каб.</small>${esc(l.room)}</div></div></div>`}});
v.innerHTML=h;if(!S.sc){S.sc=1;if(dow>0&&dow<5)document.getElementById('d'+dow)?.scrollIntoView()}}
function setTab(b){document.querySelectorAll('#nav button').forEach((x,i)=>{x.classList.toggle('on',x==b);if(x==b)$('#ind').style.transform=`translateX(${i*100}%)`})}
const num=m=>parseFloat(String(m).replace(',','.')),gc=m=>{const n=num(m);return isNaN(n)?'':n>=8?' g8':n>=5?' g5':' g1'};
const sqr=l=>`<div class="sqw"><div class="sq ${l.s=='a'?'a':l.s=='g'?'g'+gc(l.m):'p'}">${l.s=='a'?'❌':l.s=='p'?'✅':esc(l.m)}</div><small>${esc(l.d)}</small></div>`;
function evHtml(E){if(!E.length)return'';const av=a=>{a=a.filter(n=>!isNaN(n));return a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'—'};
let h=`<div class="evh"><div><small>⭐ Средний балл</small><b>${av(E.flatMap(e=>e.tests.map(t=>num(t.grade))))}</b></div><div><small>📝 Тестов</small><b>${E.reduce((n,e)=>n+e.tests.length,0)}</b></div><div><small>📚 Предметов</small><b>${E.length}</b></div></div>`;
E.forEach((e,i)=>{h+=`<div class="card ev" style="animation-delay:${i*40}ms"><div class="evt"><div class="ico">📚</div><div class="g"><div class="kv"><small>Предмет:</small><b>${esc(e.subject)}</b></div><div class="kv"><small>👤 Преподаватель:</small>${esc(e.teacher)}</div></div><span class="sav">⌀ ${av(e.tests.map(t=>num(t.grade)))}</span></div>${e.tests.map(t=>`<div class="tr"><div class="ti">📝</div><div class="kv"><small>Тест:</small>${esc(t.name)}</div><div class="sq g${gc(t.grade)}">${esc(t.grade)}</div></div>`).join('')}</div>`});return h}
const segc=(arr,cur,c)=>`<div class="seg">${arr.map(([k,l])=>`<button data-c="${c}" data-k="${k}" class="${k==cur?'on':''}">${l}</button>`).join('')}</div>`;
const settings=()=>`<div class="card set"><div class="lbl">🎨 Тема</div>${segc(TH,S.th,'th')}<div class="lbl">🎓 Группа</div>${segc(GR,S.g,'g')}<div class="lbl">👥 Подгруппа</div>${segc(SG,S.sg,'sg')}</div>`;
function onb(){v.innerHTML=`<div class="card hero ob"><div class="e">🏛</div><h2>Добро пожаловать!</h2><div class="d">Расписание, погода и журнал USM — всё в одном месте.<br>Выберите тему и свою группу</div></div>${settings()}<button class="btn" id="ok">Продолжить</button><div class="hint" style="text-align:center">Всё можно изменить позже в профиле</div>`;
$('#ok').onclick=()=>{S.ob=0;save();S.t='sch';setTab($('#nav button'));go()}}
function profile(){const u=tg?.initDataUnsafe?.user,n=u?[u.first_name,u.last_name].filter(Boolean).join(' '):'Гость';
const av=u?.photo_url?`<img class="ava" referrerpolicy="no-referrer" src="${esc(u.photo_url)}">`:`<div class="ava">${esc((n[0]||'?').toUpperCase())}</div>`;
v.innerHTML=`<div class="card prof"><div class="ban"></div>${av}<div class="in"><h2 style="margin:8px 0 2px">${esc(n)}</h2>${u?`${u.username?`<span class="pill">@${esc(u.username)}</span>`:''}<span class="pill">ID ${esc(u.id)}</span>${u.is_premium?'<span class="pill">⭐ Premium</span>':''}`:'<div class="hint" style="margin:4px 0 0">Откройте из Telegram, чтобы увидеть профиль</div>'}</div></div><div class="lbl">Настройки</div>${settings()}<div class="card list"><button class="li" id="fg"><span>🔑</span>Забыть сохранённый IDNP<i>›</i></button><button class="li" id="rs" style="color:var(--bad)"><span>🔄</span>Сбросить настройки<i>›</i></button></div><p class="foot">Приложение находится в бета-версии. Дизайн со временем будет улучшаться. Возможны баги и ошибки. По всем вопросам писать: <a href="https://t.me/flawoxxx" id="ct">@flawoxxx</a></p>`;
$('#ct').onclick=e=>{e.preventDefault();tg?.openTelegramLink?tg.openTelegramLink('https://t.me/flawoxxx'):window.open('https://t.me/flawoxxx')};
$('#fg').onclick=()=>{LS.s('idnp','');S.J=null;tg?.showAlert?tg.showAlert('IDNP удалён с устройства'):alert('IDNP удалён с устройства')};
$('#rs').onclick=()=>{try{localStorage.clear()}catch{}S.th='auto';S.g='1';S.sg='1';S.J=null;S.ob=1;applyTheme();go()}}
const WM=c=>c==0?['☀️','Ясно']:c<3?['🌤','Малооблачно']:c==3?['☁️','Пасмурно']:c<50?['🌫','Туман']:c<60?['🌦','Морось']:c<70?['🌧','Дождь']:c<80?['❄️','Снег']:c<90?['🌦','Ливень']:['⛈','Гроза'];
async function weather(){v.innerHTML='<div class="sk" style="height:230px"></div>'+'<div class="sk"></div>'.repeat(3);
try{const r=await(await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.0105&longitude=28.8638&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5')).json(),c=r.current,[e,d]=WM(c.weather_code);
v.innerHTML=`<div class="card hero"><div class="lbl" style="color:#fff;opacity:.8">Кишинёв · сейчас</div><div class="e">${e}</div><div class="big">${Math.round(c.temperature_2m)}°</div><div class="d">${d}</div><div class="m"><span>🌡 ощущается ${Math.round(c.apparent_temperature)}°</span><span>💨 ${Math.round(c.wind_speed_10m)} км/ч</span><span>💧 ${c.relative_humidity_2m}%</span></div></div><div class="lbl">Прогноз на 5 дней</div>`+
r.daily.time.map((t,i)=>{const[e,d]=WM(r.daily.weather_code[i]),dt=new Date(t);return`<div class="card day" style="animation-delay:${i*60}ms"><div class="e">${e}</div><div class="g"><b>${i?dt.toLocaleDateString('ru-RU',{weekday:'long'}):'Сегодня'}</b><small>${dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})} · ${d}</small></div><div class="tp">${Math.round(r.daily.temperature_2m_max[i])}° <i>${Math.round(r.daily.temperature_2m_min[i])}°</i></div></div>`}).join('')}
catch{v.innerHTML='<div class="card empty"><b>😕</b>Не удалось получить погоду</div>'}}
function journal(){const J=S.J;if(!J){const sv=LS.g('idnp','');v.innerHTML=`<div class="card"><h3 style="margin:0 0 4px">Электронный журнал</h3><div class="hint" style="margin:0 0 12px">Введите IDNP (на обороте паспорта) — посещаемость и оценки за тесты загрузятся с сайта USM</div><input id="id" type="text" inputmode="numeric" maxlength="13" placeholder="13 цифр" value="${esc(sv)}"><label class="hint" style="display:block"><input type="checkbox" id="rm" ${sv?'checked':''}> Запомнить на этом устройстве</label><button class="btn" id="go">Войти</button><div class="hint" id="er" style="color:var(--bad)"></div></div>`;
$('#go').onclick=async()=>{const i=$('#id').value.trim(),er=$('#er');if(!/^\d{13}$/.test(i)){er.textContent='IDNP должен состоять ровно из 13 цифр';return}
LS.s('idnp',$('#rm').checked?i:'');v.innerHTML='<div class="sk"></div>'.repeat(4);
try{const r=await fetch('/api/journal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idnp:i,initData:tg?.initData||''})}),d=await r.json();if(!r.ok)throw Error(d.error);S.J=d}catch(x){S.J=null;journal();$('#er').textContent=x.message||'Ошибка';return}journal()};return}
let h=`<div class="seg"><button data-c="sub" data-k="att" class="${S.sub=='att'?'on':''}">Оценки</button><button data-c="sub" data-k="ev" class="${S.sub=='ev'?'on':''}">Тесты</button></div>`;
if(S.sub=='att'){h+='<div class="lbl">Лимит пропусков — 33.3%</div>';if(!J.attendance.length)h+='<div class="card empty">Данных о посещаемости нет</div>';
J.attendance.forEach((a,i)=>{const p=a.percent,col=p==null?'var(--b1)':p>=33.3?'var(--bad)':p>=20?'var(--warn)':'var(--ok)';
h+=`<div class="card" style="animation-delay:${i*40}ms"><b>${esc(a.subject)}</b><div class="hint" style="margin:2px 0">👨‍🏫 ${esc(a.teacher)}</div><div class="bar"><i style="width:${Math.min(100,p||0)}%;background:${col}"></i></div><div class="st"><span>Пропуски: <b>${a.absences}${a.total?'/'+a.total:''}</b></span><span>${p!=null?'<b style="color:'+col+'">'+p+'%</b>':'всего пар неизвестно'}</span></div><div class="sqs">${a.logs.map(sqr).join('')}</div></div>`})}
else{if(!J.evaluations.length)h+='<div class="card empty">Оценок за тесты пока нет</div>';
h+=evHtml(J.evaluations)}
h+='<button class="btn alt" id="ex">Выйти</button>';v.innerHTML=h;$('#ex').onclick=()=>{S.J=null;journal()}}
go();
</script></body></html>
